# 万象拼音 个性化补丁（由雾凇配置平移而来）
# 注意：补丁是「方案优先」的，translator / menu / key_binder 这类在 wanxiang.schema.yaml
# 里已定义的项，必须写在这里才覆盖得住，写进 default.custom.yaml 无效。
patch:
  # ── 输入方案：小鹤双拼 ─────────────────────────────────────────
  # 方案名可选：全拼，自然码, 自然龙, 汉心龙，小鹤双拼, 搜狗双拼, 微软双拼,
  # 智能ABC, 紫光双拼, 国标双拼，拼音加加，乱序17
  # 也可以直接在输入框打 /flypy 切换（会自动改写本文件的这一行）。
  speller/algebra:
    __patch:
      # 模糊音（万象自带模块，等价于雾凇里手写的 z/zh、c/ch、s/sh、in/ing 双向容错）
      - wanxiang_algebra:/模糊音_z_zh
      - wanxiang_algebra:/模糊音_c_ch
      - wanxiang_algebra:/模糊音_s_sh
      - wanxiang_algebra:/模糊音_in_ing   # in ↔ ing（如 yin / ying）
      - wanxiang_algebra:/模糊音_en_eng   # en ↔ eng（如 zhen / zheng）
      # 其余可选：模糊音_nl（n/l）模糊音_ry（r/y）模糊音_hf（h/f）
      #           模糊音_rl 模糊音_kg
      - wanxiang_algebra:/base/小鹤双拼
      - wanxiang_algebra:/26jian          # 26 键；手机可用 18jian / 14jian
      #- wanxiang_algebra:/小鹤双拼提权    # 提升部分四码字优先级，可选

  # ── 语法模型（420MB gram）调轻 ──────────────────────────────────
  # 实测：gram 是按键响应的瓶颈（移走后立刻跟手）。
  # 万象默认是 max 6 / min 2，搜索范围比你原来雾凇（5/2）更宽。这里收敛：
  #   collocation_max_length 6 → 5 ：最长只做 5 字搭配打分
  #   collocation_min_length 2 → 3 ：2 字搭配不再参与打分（这项对计算量影响最大）
  # 若还是觉得慢，把 gram 文件改名成 .off 即可彻底关闭（见文件末尾备忘）。
  grammar/collocation_max_length: 5
  grammar/collocation_min_length: 3

  # ── 上屏流畅度：关掉「按段学词」 ────────────────────────────────
  # 万象默认 core_word_length: 4，上屏时会把整句拆成 ≤4 字的片段再逐个写进用户词典，
  # 这是确认瞬间的顿挫感的来源。设 0 关闭。
  # 代价：不再自动把长句拆成词组来学，但整词自动调频（enable_user_dict）仍在，
  # 需要记的词可以手动造（`` 引导）或写进 custom_phrase。
  # 想恢复就删掉这行。
  translator/core_word_length: 0

  # ── 候选数量 ───────────────────────────────────────────────────
  # 万象默认 6（且 7890 被用作声调键，最多 6），这里跟你原来的习惯保持 5
  menu/page_size: 5

  # ── 手动排序：把「置顶」从 Ctrl+P 挪走，给 emacs 的上一个候选让路 ──
  # 万象默认：Ctrl+j 上移 / Ctrl+k 下移 / Ctrl+l 重置 / Ctrl+p 置顶
  super_sequence/pin: "Control+Shift+p"

  # ── 快捷键：用 /+ 追加，不动万象自带的任何绑定 ──────────────────
  # 说明：Rime 按「先匹配先生效」处理，且 patch 无法删除列表项，
  # 所以这里只追加万象没占用的键，占用的那几个（a/e/g/k）保持万象原样。
  key_binder/bindings/+:
    # ── 从雾凇平移 ────────────────────────────────────────────────
    - {when: always, accept: "Control+period", toggle: ascii_mode}   # 中英切换
    - {when: always, accept: "Control+comma", toggle: ascii_punct}   # 中英标点
    - {when: paging, accept: comma, send: Page_Up}                   # 翻页 ,
    - {when: has_menu, accept: period, send: Page_Down}              # 翻页 .

    # ── emacs 编辑键（万象未占用的部分）────────────────────────────
    - {when: composing, accept: Control+n, send: Down}      # 下一个候选
    - {when: composing, accept: Control+p, send: Up}        # 上一个候选
    - {when: composing, accept: Control+b, send: Left}      # 光标左移
    - {when: composing, accept: Control+f, send: Right}     # 光标右移
    - {when: composing, accept: Control+d, send: Delete}    # 删除后一字
    - {when: composing, accept: Control+h, send: BackSpace} # 删除前一字
    - {when: composing, accept: Control+y, send: Page_Up}
    - {when: composing, accept: Alt+v, send: Page_Up}
    - {when: composing, accept: Control+v, send: Page_Down}
    - {when: composing, accept: Control+bracketleft, send: Escape}

    # 万象已占用、因此没有绑 emacs 的键：
    #   Ctrl+a 万象 = 候选拼音注释开关（你要求保持原样）
    #   Ctrl+e 万象 = 翻译模式          Ctrl+g 万象 = 字符集过滤
    #   Ctrl+k 万象 = 候选下移（手动排序）  Ctrl+w 万象 = 删前一个词

# ── 备忘 ─────────────────────────────────────────────────────────
# · 万象状态面板：Ctrl+` （Control + 反引号），里面有 注释关/有声调/无声调、
#   简繁、字符集、表情、英文、上下文调频等开关，从面板切换的状态会被记住。
# · 想改上面任何一个万象自带键位，只能用「整表重写 key_binder/bindings」的方式
#   （patch 无法删除列表项），代价是万象升级后新增的绑定不会自动同步。
