patch:
  # ── 万象语言模型 ────────────────────────────────────────────────
  # 惩罚用弱值：官方强值（-14/-6/-100/-20）会把模型的话语权拉满，
  # 两字词每选一次只累加很小的 userdb 增量，敌不过模型的惩罚/打分，
  # 动态调频就只剩长句可见。弱值让个人词频能透出来，长句联想仍在。
  # collocation_min_length 保持 3：两字搭配不参与模型打分，避免模型噪音盖住两字词调频。
  # 是否启用万象大模型支持长句的提示
  # 2026-11-06 重新启用（ice 配置 + 万象模型）。参数用弱值：
  #   弱值让个人词频能透出来，长句联想仍在；collocation_min_length 保持 3，
  #   两字搭配不参与模型打分，避免模型噪音盖住两字词调频。
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 5     # 5 字窗口（官方 6）
    collocation_min_length: 3     # 3 字起才打分（2 字噪音多）
  grammar/collocation_penalty: -10        # 官方 -14
  grammar/non_collocation_penalty: -3     # 官方 -6
  grammar/weak_collocation_penalty: -50   # 官方 -100
  grammar/rear_penalty: -5                # 官方 -20

  # 自动调频 / 频率浮动：只在这里（双拼方案）开启，不要放到 default.custom.yaml。
  # rime-ice 官方对全拼 rime_ice 和英文 melt_eng 都显式禁用（enable_user_dict: false），
  # 全局打开会让英文候选也被调频、逐渐漂移，所以只在 double_pinyin_flypy 打开。
  #   enable_user_dict: true  → 你选过的词/短语会被记入用户词典，用得越多权重越高，候选自然上浮（频率浮动）。
  #   enable_sentence:  true  → 记录你打出的多字短语，让「短语」也能按使用频次浮动（默认即 true，这里显式写出）。
  translator/enable_user_dict: true
  translator/enable_sentence: true

  # 候选词后面拖着的「全拼注释」：必须写在这里才生效（schema 里显式写了 8 / true）。
  # spelling_hints = 显示注音的最大字数，0 = 完全不显示。
  # 想只给单字保留注音（确认多音字、生僻字）就把 0 改成 1。
  translator/spelling_hints: 0
  translator/always_show_comments: false

  # 上下文调频：官方 recipe 为 false。开启后候选顺序会随上文跳动，
  # 破坏肌肉记忆；挂了模型时更明显（模型会按上文强排行）。
  # 2026-11-06 改回 false：模型仍参与整句/长句打分，但不再随上文重排候选。
  translator/contextual_suggestions: false
  translator/max_homophones: 4   # 原 7
  translator/max_homographs: 2   # 原 7

  # 长词优先 & v 模式优先（顺序与 rime_ice 全拼方案保持一致）
  engine/filters:
    # corrector 已摘掉：default.custom.yaml 关掉了拼音注释，它拿不到 comment 里的拼音只会空转。
    # 想恢复错音错字提示，取消下面这行注释，并把 default.custom.yaml 里的
    # spelling_hints 改回 8、always_show_comments 改回 true。
    # - lua_filter@*corrector
    # reverse_lookup_filter@radical_reverse_lookup 已摘掉：部件拆字反查，会在候选后显示五笔/拆字编码（你不使用）。
    - lua_filter@*autocap_filter
    - lua_filter@*v_filter
    - lua_filter@*pin_cand_filter
    # long_word_filter 已摘掉（2026-11-11）：方案里没有任何配置段，挂在链上只是空转，
    # 白白多一遍候选遍历。想用长词优先时加回来并补上配置段即可。
    - lua_filter@*reduce_english_filter
    # simplifier@emoji 已摘掉：表情候选（你不使用）。
    - simplifier@traditionalize
    - lua_filter@*search@radical_pinyin
    - uniquifier

  # 拼写设定
  speller:
    # 如果不想让什么标点直接上屏，可以加在 alphabet，或者编辑标点符号为两个及以上的映射
    alphabet: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA`
    # initials 定义仅作为始码的按键，排除 ` 让单个的 ` 可以直接上屏
    initials: zyxwvutsrqponmlkjihgfedcbaZYXWVUTSRQPONMLKJIHGFEDCBA
    delimiter: " '"  # 第一位<空格>是拼音之间的分隔符；第二位<'>表示可以手动输入单引号来分割拼音。
    algebra:
      - erase/^xx$/
      - derive/^([jqxy])u$/$1v/
      - derive/^([aoe])([ioun])$/$1$1$2/
      # 模糊音：2026-11-11 起「按组开关」——
      #   平翘舌：保持单向（只容错漏打 h），z/c/s 音节不再翻倍，这是性能收益最大的一组；
      #   前后鼻音：恢复双向（in/ing 互查），代价只是 in/ing/en/eng 这几个韵母的音节
      #   裂成两个拼写，搜索空间增量远小于原先 6 条全开的状态。
      # 1. 平翘舌音：只容错「漏打 h」
      - derive/^([zcs])h/$1/             # zh/ch/sh -> z/c/s (例如: 打 "ci" 也能出 "迟")
      # - derive/^([zcs])([^h])/$1h$2/   # z/c/s -> zh/ch/sh（反向容错，仍注释）
      # 2. 前后鼻音：双向容错（in/ing 互查）
      - derive/([ei])n$/$1ng/            # in/en -> ing/eng (例如: 打 "yin" 也能出 "应")
      - derive/([ei])ng$/$1n/            # ing/eng -> in/en (例如: 打 "ying" 也能出 "因")
      - xform/^([aoe])(ng)?$/$1$1$2/
      - xform/iu$/Ⓠ/
      - xform/(.)ei$/$1Ⓦ/
      - xform/uan$/Ⓡ/
      - xform/[uv]e$/Ⓣ/
      - xform/un$/Ⓨ/
      - xform/^sh/Ⓤ/
      - xform/^ch/Ⓘ/
      - xform/^zh/Ⓥ/
      - xform/uo$/Ⓞ/
      - xform/ie$/Ⓟ/
      - xform/(.)i?ong$/$1Ⓢ/
      - xform/ing$|uai$/Ⓚ/
      - xform/(.)ai$/$1Ⓓ/
      - xform/(.)en$/$1Ⓕ/
      - xform/(.)eng$/$1Ⓖ/
      - xform/[iu]ang$/Ⓛ/
      - xform/(.)ang$/$1Ⓗ/
      - xform/ian$/Ⓜ/
      - xform/(.)an$/$1Ⓙ/
      - xform/(.)ou$/$1Ⓩ/
      - xform/[iu]a$/Ⓧ/
      - xform/iao$/Ⓝ/
      - xform/(.)ao$/$1Ⓒ/
      - xform/ui$/Ⓥ/
      - xform/in$/Ⓑ/
      - xlit/ⓆⓌⓇⓉⓎⓊⒾⓄⓅⓈⒹⒻⒼⒽⒿⓀⓁⓏⓍⒸⓋⒷⓃⓂ/qwrtyuiopsdfghjklzxcvbnm/
      # - abbrev/^(.).+$/$1/  # 首字母简拼，开启后会导致 3 个字母时 kj'x 变成 k'jx 的问题
